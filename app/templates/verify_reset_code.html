<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code - Agri-Direct</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            margin: 20px;
        }
        .auth-header {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .auth-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }
        .auth-header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .auth-body {
            padding: 40px;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 18px;
            letter-spacing: 0.3em;
            text-align: center;
        }
        .form-control:focus {
            border-color: #2d5016;
            box-shadow: 0 0 0 0.2rem rgba(45, 80, 22, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 6px;
        }
        .secondary-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .secondary-link a {
            color: #2d5016;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <h1><i class="fas fa-envelope-open-text"></i> Verify Your Email</h1>
            <p>Enter the six-digit code we emailed you</p>
        </header>
        <div class="auth-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="fas fa-info-circle"></i> {{ messages[0] }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endif %}
            {% endwith %}

            <p class="text-muted text-center mb-4">The code expires after 10 minutes and can only be used once.</p>
            <form method="POST" autocomplete="off">
                <div class="mb-4">
                    <label class="form-label" for="code">Verification code</label>
                    <input id="code" type="text" name="code" class="form-control" placeholder="000000"
                           required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"
                           autocomplete="one-time-code" autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100 text-white">
                    <i class="fas fa-check"></i> Verify Code
                </button>
            </form>
            <div class="secondary-link">
                <p class="mb-0"><a href="/forgot-password">Request another code</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
