<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Agri-Direct</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .verify-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            margin: 0 20px;
        }
        .verify-header {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .verify-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        .verify-header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .verify-body { padding: 36px 40px 32px; }
        .verify-body .form-label { color: #333; font-weight: 500; margin-bottom: 8px; }
        .verify-code {
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 22px;
            letter-spacing: 0.45em;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .verify-code:focus {
            border-color: #2d5016;
            box-shadow: 0 0 0 0.2rem rgba(45, 80, 22, 0.25);
        }
        .btn-verify {
            background: linear-gradient(135deg, #2d5016 0%, #1a3408 100%);
            border: 0;
            border-radius: 6px;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-verify:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 80, 22, 0.3);
        }
        .verify-links {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .verify-links button, .verify-links a {
            color: #2d5016;
            text-decoration: none;
            font-weight: 600;
        }
        .verify-links button:hover, .verify-links a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .verify-header { padding: 26px 20px; }
            .verify-body { padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <main class="verify-container">
        <header class="verify-header">
            <h1><i class="fas fa-leaf me-1"></i> Agri-Direct</h1>
            <p><i class="fas fa-envelope-open-text me-1"></i> Email verification</p>
        </header>

        <div class="verify-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="fas fa-info-circle me-1"></i> {{ messages[0] }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}
            {% endwith %}

            <p class="text-muted text-center mb-4">
                Enter the six-digit code we sent to your email. It expires in 10 minutes.
            </p>

            <form method="post" autocomplete="off">
                <div class="mb-4">
                    <label class="form-label" for="code"><i class="fas fa-key me-1"></i> Verification code</label>
                    <input class="form-control verify-code" id="code" name="code" type="text" required
                           inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"
                           autocomplete="one-time-code" placeholder="000000" autofocus>
                </div>
                <button class="btn btn-verify w-100 text-white" type="submit">
                    <i class="fas fa-check me-1"></i> Verify email
                </button>
            </form>

            <div class="verify-links">
                <form method="post" class="mb-2">
                    <input type="hidden" name="action" value="resend">
                    <button class="btn btn-link p-0" type="submit">
                        <i class="fas fa-paper-plane me-1"></i> Send a new code
                    </button>
                </form>
                <a href="{{ url_for('register') }}"><i class="fas fa-arrow-left me-1"></i> Back to registration</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
