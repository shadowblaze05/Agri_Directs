<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knowledge Categories | Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="admin-page"><nav class="navbar navbar-dark admin-navbar px-4 py-3"><a class="navbar-brand fw-bold" href="{{ url_for('admin') }}"><i class="fas fa-leaf me-2"></i>Agri-Direct <span class="fw-normal opacity-75">/ Admin</span></a><a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm">Overview</a></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><div><a class="breadcrumb-link" href="{{ url_for('admin') }}">← Admin Console</a><h1 class="h3 mt-2">Knowledge categories</h1><p class="text-muted mb-0">Organize educational content for farmers.</p></div><button class="btn btn-success" data-bs-toggle="collapse" data-bs-target="#newCategory">+ New category</button></div>
<div class="collapse my-3" id="newCategory"><form method="post" action="{{ url_for('create_knowledge_category') }}" class="card card-body"><div class="input-group"><input name="name" class="form-control" placeholder="Category name" required><button class="btn btn-success">Create</button></div></form></div>
<form class="input-group my-3"><input name="q" value="{{ search }}" class="form-control" placeholder="Search category names"><button class="btn btn-outline-secondary">Search</button>{% if search %}<a class="btn btn-outline-secondary" href="{{ url_for('admin_knowledge_categories') }}">Clear</a>{% endif %}</form>
<div class="card shadow-sm border-0"><ul class="list-group list-group-flush">{% for category in categories %}<li class="list-group-item"><form method="post" action="{{ url_for('edit_knowledge_category', category_id=category['category_id']) }}" class="input-group input-group-sm mb-2"><input name="name" class="form-control" value="{{ category['category_name'] }}"><button class="btn btn-outline-primary">Save</button></form><form method="post" action="{{ url_for('delete_knowledge_category', category_id=category['category_id']) }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?')">Delete</button></form></li>{% else %}<li class="list-group-item text-muted">No matching categories.</li>{% endfor %}</ul></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
